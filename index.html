<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>ReviewLens — Don't trust one rating. See the evidence.</title>
    <meta name="title" content="ReviewLens — Don't trust one rating. See the evidence." />
    <meta name="description" content="ReviewLens is an evidence-driven research engine that analyzes real public discussions, resolves entities, isolates conflicts, and presents traceable decision intelligence across higher education and dining." />
    <link rel="canonical" href="https://review-lens-black.vercel.app/" />
    <meta name="theme-color" content="#FAF8F5" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://review-lens-black.vercel.app/" />
    <meta property="og:site_name" content="ReviewLens" />
    <meta property="og:title" content="ReviewLens — Don't trust one rating. See the evidence." />
    <meta property="og:description" content="ReviewLens turns scattered online experiences into traceable evidence — helping you understand what people are actually saying, where opinions agree, and where they conflict." />
    <meta property="og:image" content="https://review-lens-black.vercel.app/hero-reference.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://review-lens-black.vercel.app/" />
    <meta name="twitter:title" content="ReviewLens — Don't trust one rating. See the evidence." />
    <meta name="twitter:description" content="ReviewLens turns scattered online experiences into traceable evidence — helping you understand what people are actually saying, where opinions agree, and where they conflict." />
    <meta name="twitter:image" content="https://review-lens-black.vercel.app/hero-reference.jpg" />

    <!-- Structured Data (Schema.org JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://review-lens-black.vercel.app/#website",
          "url": "https://review-lens-black.vercel.app/",
          "name": "ReviewLens",
          "description": "Evidence-driven research engine for finding, comparing, and tracing public evidence across verified Delhi institutions and restaurants.",
          "inLanguage": "en-US",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://review-lens-black.vercel.app/#results?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://review-lens-black.vercel.app/#app",
          "name": "ReviewLens Decision Intelligence Engine",
          "applicationCategory": "ResearchApplication",
          "operatingSystem": "All modern web browsers",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          }
        }
      ]
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FAF8F5] text-[#18181B] antialiased selection:bg-[#6B7CFF]/15 selection:text-[#2A37A5] overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
